name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The deploy hook is a fire-and-forget POST: once it is sent, Cloudflare
  # builds and publishes whatever is on main, and nothing downstream can stop
  # it. So the tests cannot run "alongside" the deploy — they have to be a
  # separate job the deploy DEPENDS ON, or a red suite ships anyway.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from .nvmrc so CI, local and package.json's
      # `engines` cannot drift apart. It must be 24, not 22: the D1 test
      # shim imports node:sqlite, which Node 22 only exposes behind
      # --experimental-sqlite. Pinning 20 here is what made the first run
      # of this gate fail — package.json already requires >=22.12.0.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm ci` not `npm install`: it installs exactly the lockfile, so CI
      # can never pass against a dependency tree that no one else has.
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        run: |
          curl -fsS -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK }}" -d ""
